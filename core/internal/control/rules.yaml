# rules.yaml — 虫族 M3 集中控制层规则（2026-08-13 立 · 2026-09-20 批 C · T-31 升强制档）
# 控制层独立于 agent——模型看不到/改不了这个文件（git 版本化 + 权限保护）
# 三态: allow(放行) / block(拦截) / require_approval(需Mr2109批准)
version: 1
rules:
  # 默认策略: block(保守拒绝)—— 已红第 9 条 · 批 C T-31 按 P-099 升档; 本行是判据① 锚点(sed -n '7p')
  default: block
  tools:
    # ★ 为什么默认档从 allow 升成 block（T-31 的理由，刻意放在第 7 行**之后**）：
    #   `P-099` 逐字「**升强制**：`default` 建议 **block（显式列全）**」。老值 allow 的形态就是
    #   fail-open（规则写了、电没接）：一个新工具只要没被逐条拦，就自动放行，而且**什么都不会报**。
    # ======================= 显式列全（默认 block 之下的放行面）=========================
    # 默认 block 之后，凡是**要放行**的工具都必须逐条写出来，按两套命名空间分列：
    #   · **CA 工具名**（`core/internal/agent` 里 `gate.Check("…")` 用的真名）—— 逐条列；
    #   · **客户端工具名**（网关转发请求里模型要调的名字，历史条目）—— 原样保留。
    # ⇒ 这套「列全」由 `core/internal/control/failclosed_test.go` **机检**：它扫
    #   `core/internal/agent/*.go` 里所有 `gate.Check("X"` 的 X，逐个要求在下面有显式 allow
    #   （新增一个 CA 工具忘了登记 ⇒ 那个测试当场红 ⇒ 门禁红）。**不许靠记性。**
    #   同一条测试还钉着：默认档 = block · 缺 default ⇒ block · action 拼错 ⇒ block ·
    #   `mcp_*` 通配兜住动态名 · `bash`/`write` 的危险 args_deny 仍拦得住。

    # ===== M3 铁律: 模型不能改核心配置（客户端命名空间 · 历史条目原样保留）=====
    - name: "patch_fleet_yaml"
      action: block
      message: "模型禁改 fleet.yaml（M3 铁律——配置模块只归Mr2109/主控）"
    - name: "edit_scoring"
      action: block
      message: "模型禁改评分逻辑（M3 铁律——评分防作弊）"
    - name: "edit_rules_yaml"
      action: block
      message: "模型禁改控制层规则（规则在模型够不到的地方）"

    # ===== 客户端命名空间（网关转发请求里的工具名 · 历史条目）============================
    # 「terminal」：危险参数命中即拦（args_deny 优先级高于 action）；其余情况 require_approval
    #   —— **没有审批通道时按拒处理**（网关与 CA 的 bash 侧逐字同口径：「需要审批且无审批通道 ⇒
    #   本轮不执行」），绝不当放行。
    - name: "terminal"
      # ★ 2026-09-24 Mr2109 点头：由 `require_approval` 降为 `allow` —— 子代理要用它干开发活
      #   （跑测试/编译/git 现读）；「无审批通道按拒」这条对本场景等于禁死。牙不减：args_deny 四条原样保留。
      action: allow
      args_deny:
        - "rm -rf /"
        - "git push --force"
        - "kill -9 $(pgrep"
        - "sudo "

        # ★ D3b 第四步：**批准件目录够不着**（模型不可自签自批）
        # 为什么要写在表里而不是靠自觉：`approvals/<工具名>.json` 是「人签的逃生门」——
        # 它一旦被模型写得出来，「提者 ≠ 批者」那一层就当场作废（§17.3 铁律④③ · §17.5 反面 #6/#9）。
        # 四条模式 = 那个目录的四种写法（含 `~` 展开与裸相对路径）；命中即拦（args_deny 优先于 action）。
        - ".zerg/state/approvals"
        - "state/approvals"
        - "approvals/operator."
        - "approvals/terminal.json"
    - name: "write_file"
      action: allow
      args_deny:
        - "fleet.yaml"
        - "rules.yaml"
        - "scoring"

        # ★ D3b 第四步：**批准件目录够不着**（模型不可自签自批）
        # 为什么要写在表里而不是靠自觉：`approvals/<工具名>.json` 是「人签的逃生门」——
        # 它一旦被模型写得出来，「提者 ≠ 批者」那一层就当场作废（§17.3 铁律④③ · §17.5 反面 #6/#9）。
        # 四条模式 = 那个目录的四种写法（含 `~` 展开与裸相对路径）；命中即拦（args_deny 优先于 action）。
        - ".zerg/state/approvals"
        - "state/approvals"
        - "approvals/operator."
        - "approvals/terminal.json"
    - name: "git_commit"
      action: allow
    - name: "search_files"
      action: allow
    - name: "read_file"
      action: allow
    - name: "curl"
      action: allow

    # ===== 2026-09-24 Mr2109 点头补登：Hermes 子代理的工具面（原本落默认档 block ⇒ 403）=====
    # 背景（实测）：子代理指向 `example-35b-v2` 后，一发真链验收被 `HTTP 403 工具 browser_exec
    # 被控制层拦下（未匹配规则 ⇒ 默认 block）` 打回；`terminal` 那条也因「无审批通道按拒」而禁死。
    # 这五条按客户端命名空间补齐；`patch`/`execute_code` 的 args_deny 照抄 `write_file` 的四条护栏
    # （批准件目录不可触 + 核心配置不可改），**牙一条不减**。
    - name: "patch"
      action: allow
      args_deny:
        - "fleet.yaml"
        - "rules.yaml"
        - "scoring"
        - ".zerg/state/approvals"
        - "state/approvals"
        - "approvals/operator."
        - "approvals/terminal.json"
    - name: "execute_code"
      action: allow
      args_deny:
        - ".zerg/state/approvals"
        - "state/approvals"
        - "approvals/operator."
        - "approvals/terminal.json"
    - name: "browser_exec"
      action: allow
    - name: "web_search"
      action: allow
    - name: "web_extract"
      action: allow
    - name: "vision_analyze"
      action: allow
    - name: "tool_search"
      action: allow
    - name: "tool_describe"
      action: allow
    - name: "tool_call"
      action: allow

    # ===== 2026-09-24 第二刀：把 Hermes 客户端工具名**一次列齐**（默认拒之下，漏一个 = 整发请求 403）=====
    # 物证：一发真链验收先被 `browser_exec` 挡、补完 6 条后再被 `browser_vault_enter_code` 挡 ✗
    #   ⇒ 控制层是扫**整张工具表**（不是逐个调用才拦）⇒ 只能显式列全。
    # 名字来源：`~/.hermes/hermes-agent/tools/*.py` 的注册名（现读 `grep -rhoE 'name="[a-z_]{3,30}"' tools/*.py | sort -u`）。
    # ⚠ 登记为缺口：Hermes 侧**新增工具**后这里也会漏 ⇒ 症状就是「子代理一发 403」；须同步补。
    - name: "annotate_preview"
      action: allow
    - name: "apply_layout"
      action: allow
    - name: "browser_cdp"
      action: allow
    - name: "browser_dialog"
      action: allow
    - name: "browser_vault_enter_code"
      action: allow
    - name: "browser_vault_fill"
      action: allow
    - name: "browser_vault_list"
      action: allow
    - name: "browser_vault_save_login"
      action: allow
    - name: "browser_vault_unlock"
      action: allow
    - name: "clarify"
      action: allow
    - name: "close_terminal"
      action: allow
    - name: "computer_use"
      action: block
      message: "子代理不许驱动桌面（需人看着的活由主代理做）"
    - name: "cronjob_manage"
      action: block
      message: "子代理不许动定时任务（属主控/人签面）"
    - name: "delegate_task"
      action: block
      message: "子代理不许再派子代理（禁止无限递归）"
    - name: "desktop_preview"
      action: allow
    - name: "desktop_project"
      action: allow
    - name: "drive_preview"
      action: allow
    - name: "feishu_doc_read"
      action: allow
    - name: "focus_pane"
      action: allow
    - name: "gui_tour"
      action: allow
    - name: "image_generate"
      action: allow
    - name: "memory"
      action: block
      message: "子代理不许写长期记忆（记忆只归主代理）"
    - name: "process_manage"
      action: allow
    - name: "react_to_message"
      action: allow
    - name: "read_terminal"
      action: allow
    - name: "read_window_below"
      action: allow
    - name: "session_search"
      action: allow
    - name: "show_tip"
      action: allow
    - name: "skill_manage"
      action: allow
    - name: "skill_view"
      action: allow
    - name: "skills_list"
      action: allow
    - name: "text_to_speech"
      action: allow
    - name: "todo_list"
      action: allow
    - name: "video_analyze"
      action: allow

    # ===== CA 命名空间（`core/internal/agent` 里 gate.Check("X") 的真名 · T-31 立）==========
    # 为什么这些名字必须逐条在：CA 的工具门问的就是这些名字 —— 不列 = 默认 block = CA 干不了活。
    # 这张表 = 「哪些工具模型可以用」这件事第一次有了真源（此前它散在 10 处 gate.Check 调用里）。
    - name: "bash"
      action: allow
      args_deny:
        - "rm -rf /"
        - "rm -fr /"
        - "git push --force"
        - "git push -f "
        - "sudo "
        - "mkfs"
        - "shutdown"
        - "reboot"
        - "poweroff"
        - "dd if=/dev/zero"
        - "| sh"
        - "| bash"

        # ★ D3b 第四步：**批准件目录够不着**（模型不可自签自批）
        # 为什么要写在表里而不是靠自觉：`approvals/<工具名>.json` 是「人签的逃生门」——
        # 它一旦被模型写得出来，「提者 ≠ 批者」那一层就当场作废（§17.3 铁律④③ · §17.5 反面 #6/#9）。
        # 四条模式 = 那个目录的四种写法（含 `~` 展开与裸相对路径）；命中即拦（args_deny 优先于 action）。
        - ".zerg/state/approvals"
        - "state/approvals"
        - "approvals/operator."
        - "approvals/terminal.json"
    - name: "read"
      action: allow
    - name: "write"
      action: allow
      args_deny:
        - "fleet.yaml"
        - "rules.yaml"
        - "scoring"

        # ★ D3b 第四步：**批准件目录够不着**（模型不可自签自批）
        # 为什么要写在表里而不是靠自觉：`approvals/<工具名>.json` 是「人签的逃生门」——
        # 它一旦被模型写得出来，「提者 ≠ 批者」那一层就当场作废（§17.3 铁律④③ · §17.5 反面 #6/#9）。
        # 四条模式 = 那个目录的四种写法（含 `~` 展开与裸相对路径）；命中即拦（args_deny 优先于 action）。
        - ".zerg/state/approvals"
        - "state/approvals"
        - "approvals/operator."
        - "approvals/terminal.json"
    - name: "edit"
      action: allow
      args_deny:
        - "fleet.yaml"
        - "rules.yaml"
        - "scoring"

        # ★ D3b 第四步：**批准件目录够不着**（模型不可自签自批）
        # 为什么要写在表里而不是靠自觉：`approvals/<工具名>.json` 是「人签的逃生门」——
        # 它一旦被模型写得出来，「提者 ≠ 批者」那一层就当场作废（§17.3 铁律④③ · §17.5 反面 #6/#9）。
        # 四条模式 = 那个目录的四种写法（含 `~` 展开与裸相对路径）；命中即拦（args_deny 优先于 action）。
        - ".zerg/state/approvals"
        - "state/approvals"
        - "approvals/operator."
        - "approvals/terminal.json"
    - name: "apply_patch"
      action: allow
      args_deny:
        - "fleet.yaml"
        - "rules.yaml"
        - "scoring"

        # ★ D3b 第四步：**批准件目录够不着**（模型不可自签自批）
        # 为什么要写在表里而不是靠自觉：`approvals/<工具名>.json` 是「人签的逃生门」——
        # 它一旦被模型写得出来，「提者 ≠ 批者」那一层就当场作废（§17.3 铁律④③ · §17.5 反面 #6/#9）。
        # 四条模式 = 那个目录的四种写法（含 `~` 展开与裸相对路径）；命中即拦（args_deny 优先于 action）。
        - ".zerg/state/approvals"
        - "state/approvals"
        - "approvals/operator."
        - "approvals/terminal.json"
    - name: "glob"
      action: allow
    - name: "grep"
      action: allow
    - name: "ls"
      action: allow
    - name: "todo"
      action: allow
    - name: "spawn_agent"
      action: allow
    - name: "web_search"
      action: allow
    - name: "web_fetch"
      action: allow
    - name: "skill_load"
      action: allow
    - name: "tool_search"
      action: allow
    - name: "screenshot"
      action: allow
    # ===== 对话层两个危险调用点**接电**（2026-09-21 · 缺口-命令面-20260921.md §十.3 第 3 条）=====
    # 为什么必须在这里（实据）：这两件此前**零闸门** —— 全仓 `gate.Check("…")` 只有 10 个名字，
    # 它们不在其中，而默认档 `block` 只管「来问门的没登记」，管不了「**根本不来问门**」的。
    # 档位与 `terminal` **同档**（require_approval）：**不硬禁**（不删能力）、**保留逃生门**
    # （人签的批准件，见 core/internal/chat/chat_tool_gate.go）；无审批 ⇒ **本轮不执行**
    # （与 CA 的 `bash` 侧、网关侧逐字同口径 —— 绝不当放行）。
    - name: "delete_file"
      action: require_approval
      args_deny:
        - 'path="/"'
        - 'path="~"'
        - 'path="~/"'
        - 'path="$HOME"'
        - 'path=""'
    - name: "download"
      action: require_approval
      args_deny:
        - "| sh"
        - "| bash"
        - "sudo "
    # MCP 动态工具（`mcp_<服务>_<工具>`）：**后缀通配**一条兜住 —— 只认「尾部一个 `*`」，
    # 别的位置一律当字面量（通配不留暗权，见 gate.go 的 matchRuleName）。
    - name: "mcp_*"
      action: allow
