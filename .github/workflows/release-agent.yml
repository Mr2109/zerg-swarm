# ⚠️ 供应链：本文件里每一条 `uses:` **必须钉到全长 commit SHA**（禁浮动 tag —— `@v4`/`@stable` 级
#    可被上游改写，公开树一被人动过就不可逆）。SHA 来源 = GitHub 官方 API `git/ref`（annotated tag
#    再解一层 `git/tags`）取到的 **commit sha**；行尾注释保留原 tag 名，便于人读与升级。
#    改这条规矩前先读 `Zerg-内部文档/项目文档/v2.5.10/设计-发布闸-v1.0.md` §四。
name: Release（全产物）

# 自动升级模块 P0-c：制品与发布通道。
#
# 触发：推 v* 标签（或手动 workflow_dispatch）。
# 产物形状必须与本地 scripts/build/pack-release.sh **完全同形**（升级器只认这一套）：
#   zerg-core-darwin-arm64 / zerg-agent-darwin-arm64 / zerg-ui-darwin-arm64
#   zerg-core-linux-amd64  / zerg-agent-linux-amd64
#   zerg-wall-darwin-arm64 / zerg-wall-linux-amd64
#   zerg-cli-darwin-arm64  / zerg-cli-linux-amd64        ← 命令面 CLI（组件名 cli）
#   + 逐件 .sha256 + checksums.txt + manifest.json
#
# ⚠️ 扩大制品矩阵时（例：darwin-amd64）必须**同时**改 scripts/build/pack-release.sh 与下面的 ui/go 矩阵，
#    否则"本地假源演练通过、线上真源少件"——升级器会拒绝安装（宁可拒绝，不可装错）。
#
# 历史：本文件从前只出 zerg-agent，且从已不存在的 agent/ 目录构建（Go 1.22 硬编码）——
#      P0-c 重写为全产物；旧路径 agent/ 已由 core/cmd/zerg-agent 取代。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 权限：**最小权限起步**（S35 官方口径：`GITHUB_TOKEN` 默认只读，再在单个 job 内按需提权）——
#   顶层只给 `contents: read`；**真需要写权限的 job 单独提**（本文件只有 `release` 那一个 job 要 `contents: write`，
#   因为要建 Release；`gate`/`go`/`ui` 三个 job 只读源码 + 上传 artifact，artifact 走 `ACTIONS_RUNTIME_TOKEN`，
#   与 `GITHUB_TOKEN` 权限无关）。★ 别把 `contents: write` 放回顶层（那是「一次给足」形态）。
permissions:
  contents: read

jobs:
  gate:
    name: 版本门禁
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      commit: ${{ steps.v.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: 版本真源一致 + 标签匹配
        id: v
        run: |
          set -euo pipefail
          python3 scripts/gates/check_version.py
          V=$(grep -m1 '^const Version = ' core/internal/version/version.go | sed 's/.*"\(.*\)".*/\1/')
          C=$(git rev-parse --short HEAD)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "commit=$C"  >> "$GITHUB_OUTPUT"
          echo "版本 $V · 代码 $C"
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$V" ]; then
            echo "❌ 标签 $GITHUB_REF_NAME 与源码版本 v$V 不一致——先改版本真源再打标签"
            exit 1
          fi

  go:
    name: Go ${{ matrix.goos }}-${{ matrix.goarch }}
    needs: gate
    # runner 必须按平台给：darwin 制品的 cgo 需要 darwin 工具链——
    # 在 ubuntu 上交叉编译会 `clang: error: unsupported option '-arch'`（2026-09-11 CI 实测）。
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # cgo 差异必须按平台给：core 依赖 github.com/yalue/onnxruntime_go（cgo 包，
          # 运行时再加载 ONNX 动态库）。CGO_ENABLED=0 时它的构建约束会排除全部文件 →
          # `build constraints exclude all Go files` 直接构建失败（2026-09-11 CI 实测）。
          # darwin 用 1（与本机验证过的构建一致）；linux 用 0（实测可编，静态、免工具链）。
          - { goos: darwin, goarch: arm64, cgo: '1', runner: macos-14 }
          - { goos: linux,  goarch: amd64, cgo: '0', runner: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - name: 构建主控 + 子端（写入代码身份 commit + build_time）
        working-directory: core
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: ${{ matrix.cgo }}
        run: |
          set -euo pipefail
          BT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          SHA="${{ needs.gate.outputs.commit }}"
          LDF="-s -w -X github.com/Mr2109/zerg-swarm/core/internal/version.Commit=$SHA -X github.com/Mr2109/zerg-swarm/core/internal/version.BuildTime=$BT"
          mkdir -p ../dist
          go build -trimpath -buildvcs=false -ldflags "$LDF" -o "../dist/zerg-core-$GOOS-$GOARCH"  ./cmd/zerg-core
          go build -trimpath -buildvcs=false -ldflags "$LDF" -o "../dist/zerg-agent-$GOOS-$GOARCH" ./cmd/zerg-agent
          # 命令面 CLI（组件名 `cli`）：与 core/agent 同一 ldflags 身份、同一平台矩阵
          #   （纯 Go ⇒ linux 侧 CGO_ENABLED=0 编得出来，见 make-manifest.py 的 EXPECTED 口径）。
          go build -trimpath -buildvcs=false -ldflags "$LDF" -o "../dist/zerg-cli-$GOOS-$GOARCH"   ./cmd/zerg
          # 茧壁（Rust）：在 Linux runner 上原生构建（不做跨编）
          # 茧壁 crate 在**仓库根**的 wall/（本步 working-directory=core ⇒ 要用 ../wall）
          ( cd ../wall && cargo build --release )
          cp -p ../wall/target/release/zerg-wall ../dist/zerg-wall-$GOOS-$GOARCH 2>/dev/null || cp -p ../wall/target/release/wall ../dist/zerg-wall-$GOOS-$GOARCH
          cd ../dist
          # macOS runner 无 sha256sum（有 shasum）；两种都产出 "hash  name" 同形格式
          if command -v sha256sum >/dev/null 2>&1; then SH="sha256sum"; else SH="shasum -a 256"; fi
          for f in zerg-*; do $SH "$f" > "$f.sha256"; done
          ls -l
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: go-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
          if-no-files-found: error

  ui:
    name: UI darwin-arm64
    needs: gate
    runs-on: macos-14          # arm64 runner（与本地 Mr2109 同为 Apple Silicon）
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Rust 工具链
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -V
      - name: cargo 缓存
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ui/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ui/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: 构建 UI
        working-directory: ui
        run: |
          set -euo pipefail
          mkdir -p ../dist
          cargo build --release -p zerg-ui
          cp -p target/release/zerg-ui ../dist/zerg-ui-darwin-arm64
      - name: ad-hoc 重签名（macOS 上签名失效会被秒杀 EXIT137）
        run: |
          set -euo pipefail
          codesign -s - --force dist/zerg-ui-darwin-arm64
          codesign -dv dist/zerg-ui-darwin-arm64 2>&1 | head -3
      - name: 校验和
        run: |
          set -euo pipefail
          cd dist && shasum -a 256 zerg-ui-darwin-arm64 > zerg-ui-darwin-arm64.sha256 && cat zerg-ui-darwin-arm64.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ui-darwin-arm64
          path: dist/
          if-no-files-found: error

  release:
    name: 汇总 + 发布
    needs: [gate, go, ui]
    runs-on: ubuntu-24.04
    # 本 job 是**唯一**真需要写权限的：`gh release create` 要建 Release。
    # 只此一处提权（顶层仍是 `contents: read`）—— 将来若要出 attestation，也在本 job 内单独加
    # `id-token: write` + `attestations: write`，不加到别的 job 上。
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4（取 scripts/evals/make-manifest.py · 与本地共用）
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成 checksums.txt + manifest.json（与本地 pack-release.sh 同形）
        run: |
          set -euo pipefail
          V="${{ needs.gate.outputs.version }}"
          C="${{ needs.gate.outputs.commit }}"
          BT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          (cd dist && sha256sum zerg-* | grep -v '\.sha256' > checksums.txt)
          python3 scripts/evals/make-manifest.py dist "$V" "$C" "$BT"
          ls -l dist
      # ★ 2026-09-24（v2.5.12 · 波14 序135 · 组4 §二.4 `W-53`（`研-禁:136` `R-23`/`R-24`））：
      #   **公开面 `source_sha` 升成阻断** —— 开发机档维持「只告警」（门㉔ `--profile dev`），
      #   但**发布链上这一步必须红**：公开面「用 A 打包、声称是 B」是**不可逆**的（源件逐字）。
      #   两条判据**各自成句**（`source_sha` 不等 ／ `commit ≠ source_sha`），**合并成一句即红** ⇒
      #   现调门㉕（真源同一份代码），再走公开制品档 `--profile public`（rc=1 ⇒ 本 job 失败 ⇒ **不发布**）。
      - name: 公开制品档（阻断）：source_sha 必须等于发布提交 · 两条判据各自成句（R-23 / R-24）
        run: |
          set -euo pipefail
          python3 scripts/gates/check-manifest-freshness-two-criteria.py
          python3 scripts/gates/check-manifest-freshness-profile.py \
            --profile public --manifest dist/manifest.json --release-head "$GITHUB_SHA"
      - name: 发布到 Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.gate.outputs.version }}"
          gh release create "$TAG" dist/* \
            --title "Zerg $TAG" \
            --notes "自动构建：制品随附 SHA-256 校验和与 manifest.json（自动升级模块据此校验）。" \
            || gh release upload "$TAG" dist/* --clobber
      - name: 回读核实（发布必须可验）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "v${{ needs.gate.outputs.version }}" --json tagName,assets \
            --jq '.tagName, (.assets[] | "  \(.name)  \(.size) 字节")'
