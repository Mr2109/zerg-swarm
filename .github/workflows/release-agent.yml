name: Release zerg-agent

# 决策 3：子端二进制在 Releases 分发（用户不必装 Go 即可组集群）
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.goos }}-${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: darwin, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: linux,  goarch: amd64 }
          - { goos: linux,  goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: agent/go.sum
      - name: 交叉编译（命名规范 zerg-agent-<os>-<arch>）
        working-directory: agent
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags "-s -w" \
            -o "zerg-agent-${{ matrix.goos }}-${{ matrix.goarch }}" ./cmd/zerg-agent
          shasum -a 256 "zerg-agent-${{ matrix.goos }}-${{ matrix.goarch }}" \
            > "zerg-agent-${{ matrix.goos }}-${{ matrix.goarch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: zerg-agent-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            agent/zerg-agent-*
      - name: 附加到 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: agent/zerg-agent-*
