name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: 主控 + 子端（Go）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: |
            core/go.sum
            agent/go.sum
      - name: 配置 git 身份（zerg-git 相关测试要 git commit）
        run: |
          git config --global user.email "ci@example.invalid"
          git config --global user.name "Zerg CI"
      - name: shell 静态检查（$VAR 后紧跟非 ASCII → unbound variable）
        run: python3 scripts/check-shell-unicode-vars.py --check scripts/*.sh *.sh
      - name: core 构建 + 测试
        working-directory: core
        run: |
          go build ./...
          go test ./... -count=1
      - name: agent 构建 + 测试
        working-directory: agent
        run: |
          go build ./...
          go test ./... -count=1

  ui:
    name: 桌面 UI（Rust）
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo test
        working-directory: ui
        run: cargo test -p zerg-ui

  version:
    name: 版本号一致性（UI ↔ Go 单一来源）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查
        run: python3 scripts/check_version.py

  docs:
    name: 文档双语门禁（配对/标题/链接）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查
        run: python3 scripts/check_docs.py

  i18n:
    name: i18n 门禁（键对称/引用完整/占位符/中文基线）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 检查
        run: python3 ui/scripts/check-i18n.py

  secrets:
    name: 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        # 版本必须与本地/仓库工具一致：8.24.3 会对 memory_test.go 的**合成夹具**误报
        # generic-api-key（同配置 8.30.1 = 0 命中）。版本漂移 = 门禁结论不可复现。
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
