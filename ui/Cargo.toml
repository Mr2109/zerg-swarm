[package]
name = "zerg-ui"
version = "2.5.11"
edition = "2021"
description = "虫族 UI——任务/集群/Git/日志/文档/资源库一体化界面"

[dependencies]
eframe = "0.36"
egui = "0.36"
egui_extras = { version = "0.36", features = ["datepicker", "svg"] }
egui-async = "0.6"
egui_commonmark = "0.25"
ropey = "0.6" # M3 Ferrite 重写 md 编辑器（文本缓冲——O(log n)）
comrak = "0.22" # M3 Ferrite 重写 md 编辑器（Markdown 解析——Ferrite 同款）
syntect = "5.1" # F6 语法高亮（代码块——Ferrite 同款）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
futures-util = "0.3" # C3 流式（SSE——StreamExt）
rfd = "0.15" # D3 多模态：native 文件对话框（选图）
iconflow = { version = "1.0", features = ["all-packs"] } # P3 图标：14 开源包 34 TTF 嵌入式（MIT——v2.6 开源干净）
chrono = "0.4"
rust-i18n = "4"
egui_virtual_list = "0.12"
# 虫茧（T8——zerg-cocoon 示例虫茧——path 跨仓独立 git）
# 2026-09-11 B 批（决策 5）：示例虫茧未完善，**首版不随公开快照发布**。
# 因此依赖改为 optional：私有仓通过下方 default feature 保持启用（本机行为不变），
# 公开快照删除本依赖与 default feature 后仍可编译（未启用时虫茧平台显示空栅格 + 未装载提示）。

# 虫茧（C9 第 4 步——zerg-cocoon 文档——path 跨仓独立 git，自带 Go 服务）
# 与示例虫茧同款口径：`optional` + feature 装载态（铭牌 `cocoon::DOCS.loaded` 读它）；
# 公开快照（publish/mirror-public-lib.py 的 CARGO_SUBS / publish-public.sh §3a）两侧解依赖 ⇒
# 公开快照**不含任何茧代码**，平台页照常编译（未装载形态）。


[features]
zerg-roundtable = []  # 公开镜像：该虫茧（独立仓）不随发布——保留同名空 feature 以消除 cfg 警告
# 文档茧（C9 第 4 步）：装载态开关（铭牌 `cocoon::DOCS.loaded` 读它）。
# 第 4 步接上 path 依赖 ⇒ 本机默认构建**装载**（平台卡「打开」直接进文档界面）。
# 公开快照同款口径：保留同名空 feature（`zerg-cocoon-docs = []`）以消除 cfg 警告（publish-public.sh §3a 同思路）。
zerg-cocoon-docs = []  # 公开镜像：该虫茧（独立仓）不随发布——保留同名空 feature 以消除 cfg 警告
[profile.release]
opt-level = 3
lto = true
