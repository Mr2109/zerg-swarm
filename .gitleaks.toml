# gitleaks 配置（公开快照根 .gitleaks.toml）
# 目的：保留官方默认规则集，仅对"测试夹具"这类**合成假密钥**做白名单，避免误报阻断 CI/发布。

[extend]
useDefault = true

# 威胁扫描测试里用的合成密钥（用于验证 credential 分类，不是真凭据）
[[allowlists]]
description = "内存子系统的威胁扫描测试夹具（合成假密钥）"
paths = [
  'core/internal/memory/memory_test.go',
]
# 显式列出合成假值：路径白名单在部分 gitleaks 版本（如 CI 的 8.24.3）不生效，
# 直接对"假密钥值"做正则豁免才版本无关（该值仅用于验证 credential 分类，非真凭据）。
regexes = [
  'api_key = 8f3a9c2b7d1e4f6a8b2c4d6e8f0a1b3c',
  'strings\\.Repeat\\(\\"QWxhZGRpbjpvcGVu\\"',
]
